<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Session Card</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: rgba(17, 19, 24, 0.95);
        --panel: rgba(33, 36, 45, 0.9);
        --line: rgba(255, 255, 255, 0.09);
        --text: #e9edf5;
        --muted: #8b93a5;
        --accent: #7fd7ff;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      #card {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 9px 10px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: hidden;
      }
      .head {
        display: flex;
        align-items: center;
        padding: 1px 2px 3px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .head-title { font-size: 11px; color: var(--muted); letter-spacing: 0.6px; }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-right: 2px;
      }
      .message {
        font-family: inherit;
        display: flex;
        align-items: flex-start;
        gap: 7px;
        width: 100%;
        box-sizing: border-box;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 6px 8px;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        flex: none;
      }
      .message:hover { border-color: rgba(127, 215, 255, 0.45); }
      .msg-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex: none; }
      .msg-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
      .msg-title {
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .msg-sub { font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .msg-badge { font-size: 12px; color: var(--accent); margin-top: 1px; }
      .foot { display: flex; gap: 5px; flex: none; }
      .foot-btn {
        font-family: inherit;
        flex: 1;
        font-size: 10px;
        color: var(--text);
        background: rgba(127, 215, 255, 0.08);
        border: 1px solid rgba(127, 215, 255, 0.3);
        border-radius: 7px;
        padding: 4px 6px;
        cursor: pointer;
      }
      .foot-btn:hover { background: rgba(127, 215, 255, 0.18); }
      .foot-btn.primary { color: #dff6ff; }
      .list::-webkit-scrollbar { width: 5px; }
      .list::-webkit-scrollbar-thumb { background: #343a49; border-radius: 5px; }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script src="./card.js"></script>
  </body>
</html>
