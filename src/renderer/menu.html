<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pet Menu</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: rgba(17, 19, 24, 0.94);
        --panel: rgba(31, 34, 42, 0.9);
        --line: rgba(255, 255, 255, 0.08);
        --text: #e9edf5;
        --muted: #8b93a5;
        --accent: #7fd7ff;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      #menu {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        overflow-y: auto;
      }
      .header {
        padding: 2px 4px 10px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 8px;
      }
      .title { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
      .sub { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
      .section { margin: 9px 0; }
      .section-title {
        font-size: 11px;
        color: var(--muted);
        margin: 0 2px 6px;
        letter-spacing: 1px;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chips.vertical { flex-direction: column; flex-wrap: nowrap; }
      .chip, .mini, .toggle, .wide {
        font-family: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .chip { flex: 1 1 auto; }
      .chip:hover, .mini:hover, .wide:hover { border-color: rgba(127, 215, 255, 0.5); }
      .chip.active {
        border-color: var(--accent);
        background: rgba(127, 215, 255, 0.13);
        color: #dff6ff;
      }
      .size-row { display: flex; gap: 8px; align-items: center; }
      .slider {
        flex: 1;
        accent-color: var(--accent);
        height: 3px;
      }
      .mini { padding: 5px 9px; font-size: 11px; color: var(--muted); }
      .hint { margin-top: 5px; font-size: 10px; color: var(--muted); line-height: 1.4; }
      .toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 5px;
        text-align: left;
      }
      .knob {
        width: 26px;
        height: 14px;
        border-radius: 999px;
        background: #3a3f4d;
        position: relative;
        transition: background 0.2s;
      }
      .knob::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c7ccd8;
        transition: transform 0.2s;
      }
      .toggle.on .knob { background: rgba(127, 215, 255, 0.55); }
      .toggle.on .knob::after { transform: translateX(12px); background: #eaffff; }
      .footer { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .wide { width: 100%; padding: 8px 10px; }
      .wide.danger { color: #ffb3b3; }
      .wide.danger:hover { border-color: rgba(255, 107, 107, 0.6); }
      #menu::-webkit-scrollbar { width: 6px; }
      #menu::-webkit-scrollbar-thumb { background: #343a49; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="menu"></div>
    <script src="./menu.js"></script>
  </body>
</html>
