<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #pet {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .dot {
        position: fixed;
        right: 10px;
        top: 10px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        display: block;
        background: #8b93a5;
      }
      .dot.gray { background: #8b93a5; }
      .dot.blue { background: #59a7ff; animation: pulse 1.4s infinite; }
      .dot.green { background: #6ee7a8; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.35); opacity: 0.65; }
      }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <div id="status-dot" class="dot"></div>
    <script src="../public/vendor/spine-arknights.js"></script>
    <script src="./pet.js"></script>
  </body>
</html>
